<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PennyGas - Ultra Cheap Refuel</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0b0e14; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #151a26; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); text-align: center; width: 380px; }
        h1 { color: #00ffa3; font-size: 26px; margin-bottom: 5px; }
        p { color: #8a9fc2; font-size: 14px; margin-top: 0; margin-bottom: 25px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 12px; color: #8a9fc2; text-transform: uppercase; display: block; margin-bottom: 5px; }
        select, input { width: 100%; padding: 10px; background-color: #0b0e14; border: 1px solid #2b313e; border-radius: 6px; color: white; box-sizing: border-box; }
        .btn { background-color: #4e44ce; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; transition: background 0.2s; }
        .btn:hover { background-color: #6358e1; }
        .invoice-box { background-color: #0b0e14; border: 1px dashed #2b313e; border-radius: 6px; padding: 12px; margin-top: 15px; text-align: left; font-size: 13px; }
        .invoice-row { display: flex; justify-content: space-between; margin-bottom: 6px; color: #8a9fc2; }
        .invoice-total { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid #2b313e; font-weight: bold; color: #00ffa3; }
        #statusMessage { margin-top: 15px; font-family: monospace; color: #00ffa3; background: #0b0e14; padding: 10px; border-radius: 4px; display: none; word-wrap: break-word; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h1>⛽ PennyGas</h1>
    <p>The cheapest Ethereum gas refill on earth. Flat $0.06 platform fee.</p>
    
    <button id="connectBtn" class="btn" onclick="connectPhantomEVM()">Connect Phantom Wallet</button>

    <!-- Everything inside this block is safely hidden until the wallet successfully connects -->
    <div id="dashboard" style="display: none; margin-top: 20px;">
        <div class="form-group">
            <label>You Pay From Chain</label>
            <select id="sourceChain" onchange="fetchLiveInvoiceQuote()">
                <option value="1">Ethereum Mainnet</option>
                <option value="42161" selected>Arbitrum One</option>
            </select>
        </div>

        <div class="form-group">
            <label>Payment Token</label>
            <select id="sourceToken" onchange="fetchLiveInvoiceQuote()">
                <option value="USDC">USDC (Stablecoin)</option>
                <option value="USDT">USDT (Stablecoin)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Target Gas Amount Needed</label>
            <input type="number" id="ethAmount" value="0.01" step="0.005" min="0.001" oninput="fetchLiveInvoiceQuote()">
        </div>

        <div class="invoice-box">
            <div class="invoice-row"><span>Across Bridge Fee:</span> <span id="uiBridgeFee">Calculating...</span></div>
            <div class="invoice-row"><span>Gas Spike Buffer (2%):</span> <span id="uiBuffer">Calculating...</span></div>
            <!-- Fixed: Re-added missing HTML left angle brackets element here -->
            <div class="invoice-row"><span>PennyGas Fee:</span> <span id="uiProfit">$0.06</span></div>
            <div class="invoice-total"><span>Total Invoice Amount:</span> <span id="uiTotal">Calculating...</span></div>
        </div>

        <button id="requestBtn" class="btn" style="background-color: #22c55e;" onclick="requestGaslessApproval()">Authorize Gasless Refuel</button>
    </div>

    <div id="statusMessage"></div>
</div>

<script>
    window.activeUserAddress = "";
    window.ethersProvider = null;
    window.ethersSigner = null;

    const tokenMatrix = {
        "1": { "USDC": "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48", "USDT": "0xdAC17F958D2ee523a2206206994597C13D831ec7" },
        "42161": { "USDC": "0xaf88d065e77c8cC2239327C5EDb3A432268e5831", "USDT": "0xFd086b97270535728a370aa7c969c19027158356" }
    };

    // Kept your split template URL strings layout intact
    const BACKEND_BASE = "https://pennygas-backend"; 
    const BACKEND_DOMAIN = "onrender.com";
    const BACKEND_URL = `${BACKEND_BASE}.${BACKEND_DOMAIN}`;

    async function fetchLiveInvoiceQuote() {
        const chainId = document.getElementById('sourceChain').value;
        const tokenSymbol = document.getElementById('sourceToken').value;
        const amount = document.getElementById('ethAmount').value;
        const tokenAddress = tokenMatrix[chainId][tokenSymbol];
        const currentGasLabel = (chainId === "42161") ? "ARB" : "ETH";

        if (!amount || amount <= 0) return;

        try {
            const targetUrl = `${BACKEND_URL}/api/quote?originChainId=${chainId}&tokenAddress=${tokenAddress}&targetEthAmount=${amount}`;
            const response = await fetch(targetUrl);
            const data = await response.json();

            if (!data || data.error) {
               document.getElementById('uiTotal').innerText = "Route or amount invalid";
               return;
            }

            document.getElementById('uiBridgeFee').innerText = `${data.bridgeFee} ${currentGasLabel}`;
            document.getElementById('uiBuffer').innerText = `${data.buffer} ${currentGasLabel}`;
            document.getElementById('uiTotal').innerText = `${data.totalInvoiceEth} ${currentGasLabel}`;
        } catch (error) {
            document.getElementById('uiTotal').innerText = "Server link offline";
        }
    }

    async function connectPhantomEVM() {
        if (typeof window.ethereum === 'undefined') {
            console.log("Phantom dashboard bypass fallback mode active.");
            document.getElementById('connectBtn').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            fetchLiveInvoiceQuote();
            return;
        }

        try {
            const baseModule = window.ethers || (window.ethereum && window.ethereum.ethers);
            if (typeof baseModule !== 'undefined') {
                window.ethersProvider = new baseModule.BrowserProvider(window.ethereum);
                window.ethersSigner = await window.ethersProvider.getSigner();
            }

            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            
            // Fixed: Grabs the single string element at index zero from the web3 injection array
            window.activeUserAddress = accounts[0];
            const displayAddr = window.activeUserAddress;

            document.getElementById('statusMessage').innerText = `🔗 Connected: ${displayAddr.substring(0,6)}...${displayAddr.substring(displayAddr.length - 4)}`;
            document.getElementById('statusMessage').style.display = 'block';
            document.getElementById('connectBtn').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            
            fetchLiveInvoiceQuote();
        } catch (error) {
            console.error(error);
            alert("Connection refused.");
        }
    }

    async function requestGaslessApproval() {
        if (!window.activeUserAddress) {
            alert("Connect your wallet first!");
            return;
        }

        const chainId = parseInt(document.getElementById('sourceChain').value);
        const tokenSymbol = document.getElementById('sourceToken').value;
        const tokenAddress = tokenMatrix[chainId][tokenSymbol];
        const baseModule = window.ethers || (window.ethereum && window.ethereum.ethers);

        if (!baseModule || !window.ethersSigner) {
            alert("Web3 target execution layer dropped. Please re-authenticate your signature.");
            return;
        }

        try {
            document.getElementById('statusMessage').innerText = "⏳ Requesting gasless permit...";
            document.getElementById('statusMessage').style.display = 'block';

            const pennyGasVaultSpender = "0x0000000000000000000000000000000000000000"; 
            const nonce = 0; 
            const deadline = Math.floor(Date.now() / 1000) + 3600; 
            const valueToAuthorize = baseModule.parseUnits("15.00", 6); 

            const domain = {
                name: tokenSymbol === "USDC" ? "USD Coin" : "Tether USD",
                version: "2",
                chainId: chainId,
                verifyingContract: tokenAddress
            };

            const types = {
                Permit: [
                    { name: 'owner', type: 'address' },
                    { name: 'spender', type: 'address' },
                    { name: 'value', type: 'uint256' },
                    { name: 'nonce', type: 'uint256' },
                    { name: 'deadline', type: 'uint256' }
                ]
            };

            const message = {
                owner: window.activeUserAddress,
                spender: pennyGasVaultSpender,
                value: valueToAuthorize.toString(),
                nonce: nonce,
                deadline: deadline
            };

            const signature = await window.ethersSigner.signTypedData(domain, types, message);
            const { v, r, s } = baseModule.Signature.from(signature);

            document.getElementById('statusMessage').innerText = "⏳ Relaying transaction payload to backend...";

            const payload = {
                owner: window.activeUserAddress,
                spender: pennyGasVaultSpender,
                value: valueToAuthorize.toString(),
deadline: deadline,v: v, r: r, s: s};const submitUrl = ${BACKEND_URL}/api/submit-permit;const response = await fetch(submitUrl, {method: 'POST',headers: { 'Content-Type': 'application/json' },body: JSON.stringify(payload)});const result = await response.json();if (result.success) {document.getElementById('statusMessage').innerText = "✅ Refuel Processed Successfully!";} else {document.getElementById('statusMessage').innerText = ❌ Relay Failed: ${result.error || 'Unknown error'};}} catch (error) {console.error(error);document.getElementById('statusMessage').innerText = "❌ Signature rejected or system error.";}}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PennyGas - Ultra Cheap Refuel</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0b0e14; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #151a26; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); text-align: center; width: 380px; }
        h1 { color: #00ffa3; font-size: 26px; margin-bottom: 5px; }
        p { color: #8a9fc2; font-size: 14px; margin-top: 0; margin-bottom: 25px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 12px; color: #8a9fc2; text-transform: uppercase; display: block; margin-bottom: 5px; }
        select, input { width: 100%; padding: 10px; background-color: #0b0e14; border: 1px solid #2b313e; border-radius: 6px; color: white; box-sizing: border-box; }
        .btn { background-color: #4e44ce; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; transition: background 0.2s; }
        .btn:hover { background-color: #6358e1; }
        .invoice-box { background-color: #0b0e14; border: 1px dashed #2b313e; border-radius: 6px; padding: 12px; margin-top: 15px; text-align: left; font-size: 13px; }
        .invoice-row { display: flex; justify-content: space-between; margin-bottom: 6px; color: #8a9fc2; }
        .invoice-total { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid #2b313e; font-weight: bold; color: #00ffa3; }
        #statusMessage { margin-top: 15px; font-family: monospace; color: #00ffa3; background: #0b0e14; padding: 10px; border-radius: 4px; display: none; word-break: break-word; }
    </style>
</head>
<body>
<div class="container">
    <h1>⛽ PennyGas</h1>
    <p>The cheapest Ethereum gas refill on earth. Flat $0.06 platform fee.</p>
    
    <button id="connectBtn" class="btn" onclick="connectPhantomEVM()">Connect Phantom Wallet</button>

    <div id="dashboard" style="display: none; margin-top: 20px;">
        <div class="form-group">
            <label for="sourceChain">Gas Needed for:</label>
            <select id="sourceChain" onchange="fetchLiveInvoiceQuote()">
                <option value="1">Ethereum Mainnet</option>
                <option value="42161">Arbitrum One</option>
                <option value="11155111" selected>Ethereum Sepolia Testnet</option>
            </select>
        </div>

        <div class="form-group">
            <label>Payment Token</label>
            <select id="sourceToken" onchange="fetchLiveInvoiceQuote()">
                <option value="USDC">USDC (Stablecoin)</option>
                <option value="USDT">USDT (Stablecoin)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Target Gas Amount Needed</label>
            <input type="number" id="ethAmount" value="0.01" step="0.005" min="0.001" oninput="fetchLiveInvoiceQuote()">
        </div>

        <div class="invoice-box">
            <div class="invoice-row"><span>Across Bridge Fee:</span> <span id="uiBridgeFee">Calculating...</span></div>
            <div class="invoice-row"><span>Gas Spike Buffer (2%):</span> <span id="uiBuffer">Calculating...</span></div>
            <div class="invoice-row"><span>PennyGas Fee:</span> <span id="uiProfit">$0.06</span></div>
            <div class="invoice-total"><span>Total Invoice Amount:</span> <span id="uiTotal">Calculating...</span></div>
        </div>

        <button id="requestBtn" class="btn" style="background-color: #22c55e;" onclick="requestGaslessApproval()">Authorize Gasless Refuel</button>
    </div>

    <div id="statusMessage"></div>
</div>
<script>
window.activeUserAddress = "";

const tokenMatrix = {
    "1": { "USDC": "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48", "USDT": "0xdAC17F958D2ee523a2206206994597C13D831ec7" },
    "42161": { "USDC": "0xaf88d065e77c8cC2239327C5EDb3A432268e5831", "USDT": "0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9" },
    "11155111": { "USDC": "0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238", "USDT": "0xaA8E23Fb1079EA71e0a56F48a2Aa51851D8433D0" }
};

const VAULT_ADDRESS = "0x51DC9E51e9F1216075E58E6F7045C4F17965d21C";
const BACKEND_URL = "http://localhost:10000"; 

async function fetchLiveInvoiceQuote() {
    const chainId = document.getElementById('sourceChain').value;
    const tokenSymbol = document.getElementById('sourceToken').value;
    const amount = document.getElementById('ethAmount').value;
    
    if (!tokenMatrix[chainId] || !tokenMatrix[chainId][tokenSymbol]) {
        document.getElementById('uiTotal').innerText = "Select valid network";
        return;
    }
    const tokenAddress = tokenMatrix[chainId][tokenSymbol];

    if (!amount || amount <= 0) return;

    try {
        const response = await fetch(`${BACKEND_URL}/api/quote?originChainId=${chainId}&tokenAddress=${tokenAddress}&targetEthAmount=${amount}`);
        const data = await response.json();

        if (!data || data.error) {
           document.getElementById('uiTotal').innerText = "Route or amount invalid";
           return;
        }

        document.getElementById('uiBridgeFee').innerText = `${data.bridgeFee} ETH`;
        document.getElementById('uiBuffer').innerText = `${data.buffer} ETH`;
        document.getElementById('uiTotal').innerText = `${data.totalInvoiceEth} ETH`;
        
        document.getElementById('uiTotal').dataset.rawTokenAmount = data.rawTokenAmount || "15000000"; 
        document.getElementById('uiTotal').dataset.rawEthAmount = data.rawEthAmount || "10000000000000000";
    } catch (error) {
        document.getElementById('uiTotal').innerText = "Server link offline";
    }
}
async function connectPhantomEVM() {
    if (typeof window.ethereum === 'undefined') {
        alert("Phantom extension not detected!");
        return;
    }

    try {
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        window.activeUserAddress = accounts + "";

        document.getElementById('statusMessage').innerText = `🔗 Connected: ${window.activeUserAddress.substring(0,6)}...${window.activeUserAddress.substring(window.activeUserAddress.length - 4)}`;
        document.getElementById('statusMessage').style.display = 'block';
        document.getElementById('connectBtn').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        
        fetchLiveInvoiceQuote();
    } catch (error) {
        alert("Wallet Handshake Error: " + error.message);
    }
}

async function requestGaslessApproval() {
    if (!window.activeUserAddress) {
        alert("Connect your wallet first!");
        return;
    }

    const chainId = document.getElementById('sourceChain').value;
    const tokenSymbol = document.getElementById('sourceToken').value;
    const tokenAddress = tokenMatrix[chainId][tokenSymbol];

    try {
        document.getElementById('statusMessage').innerText = "⏳ Compiling gasless signature permit...";
        document.getElementById('statusMessage').style.display = 'block';

        const deadline = Math.floor(Date.now() / 1000) + 3600; 
        const tokenAmountRaw = document.getElementById('uiTotal').dataset.rawTokenAmount || "15000000";
        const ethToUserRaw = document.getElementById('uiTotal').dataset.rawEthAmount || "10000000000000000";

        const nonceResponse = await window.ethereum.request({
            method: 'eth_call',
            params: [{
                to: VAULT_ADDRESS,
                data: "0x7ecebe00" + window.activeUserAddress.replace("0x", "").padStart(64, "0")
            }, "latest"]
        });
        const currentNonce = parseInt(nonceResponse, 16) || 0;
        const msgParams = JSON.stringify({
            types: {
                EIP712Domain: [
                    { name: "name", type: "string" }, { name: "version", type: "string" },
                    { name: "chainId", type: "uint256" }, { name: "verifyingContract", type: "address" }
                ],
                GaslessRefuel: [
                    { name: "user", type: "address" }, { name: "token", type: "address" },
                    { name: "tokenAmount", type: "uint256" }, { name: "ethToUser", type: "uint256" },
                    { name: "nonce", type: "uint256" }, { name: "deadline", type: "uint256" }
                ]
            },
            primaryType: "GaslessRefuel",
            domain: { name: "PennyGas Refuel", version: "1", chainId: parseInt(chainId), verifyingContract: VAULT_ADDRESS },
            message: { user: window.activeUserAddress, token: tokenAddress, tokenAmount: tokenAmountRaw, ethToUser: ethToUserRaw, nonce: currentNonce, deadline: deadline }
        });

        const signature = await window.ethereum.request({
            method: 'eth_signTypedData_v4',
            params: [window.activeUserAddress, msgParams]
        });

        const r = signature.slice(0, 66);
        const s = "0x" + signature.slice(66, 130);
        const v = parseInt(signature.slice(130, 132), 16);

        document.getElementById('statusMessage').innerText = "✅ Signed! Sending variables to routing relayer...";

        const response = await fetch(`${BACKEND_URL}/api/refuel`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                user: window.activeUserAddress,
                token: tokenAddress,
                tokenAmount: tokenAmountRaw,
                ethToUser: ethToUserRaw,
                deadline: deadline,
                v: v, r: r, s: s
            })
        });

        const relayData = await response.json();
        if (relayData.success) {
            document.getElementById('statusMessage').innerHTML = `🚀 Refuel Complete! <a href="https://etherscan.io{relayData.transactionHash}" target="_blank">View on Etherscan</a>`;
        } else {
            document.getElementById('statusMessage').innerText = "❌ Vault Error: " + relayData.error;
        }

    } catch (error) {
        document.getElementById('statusMessage').innerText = "❌ Handshake Error: " + error.message;
    }
}
</script>
</body>
</html>

<!DOCTYPE html>

mentById('dashboard').style.display='block',fetchLiveInvoiceQuote()}catch(n){alert('Connection refused.')}}async function requestGaslessApproval(){if(!window.activeUserAddress||!window.ethersSigner)return void alert('Connect your wallet first!');const e=parseInt(document.getElementById('sourceChain').value),t=document.getElementById('sourceToken').value,n=tokenMatrix[e][t];try{document.getElementById('statusMessage').innerText='⏳ Requesting gasless permit...',document.getElementById('statusMessage').style.display='block';const a='0x0000000000000000000000000000000000000000',s=0,o=Math.floor(Date.now()/1000)+3600,c=ethers.parseUnits('15.00',6),r={name:'USDC'===t?'USD Coin':'Tether USD',version:'2',chainId:e,verifyingContract:n},d={Permit:[{name:'owner',type:'address'},{name:'spender',type:'address'},{name:'value',type:'uint256'},{name:'nonce',type:'uint256'},{name:'deadline',type:'uint256'}]},u={owner:window.activeUserAddress,spender:a,value:c.toString(),nonce:s,deadline:o},m=await window.ethersSigner.signTypedData(r,d,u),{v:i,r:g,s:l}=ethers.Signature.from(m);document.getElementById('statusMessage').innerText='⏳ Relaying transaction payload to backend...';const E={owner:window.activeUserAddress,spender:a,value:c.toString(),deadline:o,v:i,r:g,s:l},v=await fetch(`${BACKEND_URL}/api/submit-permit`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(E)}),p=await v.json();p.success?document.getElementById('statusMessage').innerText='✅ Refuel Processed Successfully!':document.getElementById('statusMessage').innerText=`❌ Relay Failed: ${p.error||'Unknown error'}`}catch(f){console.error(f),document.getElementById('statusMessage').innerText='❌ Signature rejected or system error.'}}window.connectPhantomEVM=connectPhantomEVM,window.fetchLiveInvoiceQuote=fetchLiveInvoiceQuote,window.requestGaslessApproval=requestGaslessApproval;"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0b0e14; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #151a26; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); text-align: center; width: 380px; }
        h1 { color: #00ffa3; font-size: 26px; margin-bottom: 5px; }
        p { color: #8a9fc2; font-size: 14px; margin-top: 0; margin-bottom: 25px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 12px; color: #8a9fc2; text-transform: uppercase; display: block; margin-bottom: 5px; }
        select, input { width: 100%; padding: 10px; background-color: #0b0e14; border: 1px solid #2b313e; border-radius: 6px; color: white; box-sizing: border-box; }
        .btn { background-color: #4e44ce; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; transition: background 0.2s; }
        .btn:hover { background-color: #6358e1; }
        .invoice-box { background-color: #0b0e14; border: 1px dashed #2b313e; border-radius: 6px; padding: 12px; margin-top: 15px; text-align: left; font-size: 13px; }
        .invoice-row { display: flex; justify-content: space-between; margin-bottom: 6px; color: #8a9fc2; }
        .invoice-total { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid #2b313e; font-weight: bold; color: #00ffa3; }
        #statusMessage { margin-top: 15px; font-family: monospace; color: #00ffa3; background: #0b0e14; padding: 10px; border-radius: 4px; display: none; word-wrap: break-word; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h1>⛽ PennyGas</h1>
    <p>The cheapest Ethereum gas refill on earth. Flat \$0.06 platform fee.</p>
    
    <button id="connectBtn" class="btn" onclick="window.connectPhantomEVM()">Connect Phantom Wallet</button>

    <div id="dashboard" style="display: none; margin-top: 20px;">
        <div class="form-group">
            <label>You Pay From Chain</label>
            <select id="sourceChain" onchange="window.fetchLiveInvoiceQuote()">
                <option value="1">Ethereum Mainnet</option>
                <option value="42161" selected>Arbitrum One</option>
            </select>
        </div>

        <div class="form-group">
            <label>Payment Token</label>
            <select id="sourceToken" onchange="window.fetchLiveInvoiceQuote()">
                <option value="USDC">USDC (Stablecoin)</option>
                <option value="USDT">USDT (Stablecoin)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Target Gas Amount Needed</label>
            <input type="number" id="ethAmount" value="0.01" step="0.005" min="0.001" oninput="window.fetchLiveInvoiceQuote()">
        </div>

        <div class="invoice-box">
            <div class="invoice-row"><span>Across Bridge Fee:</span> <span id="uiBridgeFee">Calculating...</span></div>
            <div class="invoice-row"><span>Gas Spike Buffer (2%):</span> <span id="uiBuffer">Calculating...</span></div>
            <div class="invoice-row"><span>PennyGas Fee:</span> <span id="uiProfit">\$0.06</span></div>
            <div class="invoice-total"><span>Total Invoice Amount:</span> <span id="uiTotal">Calculating...</span></div>
        </div>

        <button id="requestBtn" class="btn" style="background-color: #22c55e;" onclick="window.requestGaslessApproval()">Authorize Gasless Refuel</button>
    </div>

    <div id="statusMessage"></div>
</div>

</body>
</html>

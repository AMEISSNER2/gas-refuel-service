<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PennyGas Refuel Core Build</title>
    <style>
        :root {
            --bg-deep: #0B0E14;
            --surface-panel: #161B26;
            --accent-green: #00E676;
            --text-primary: #FFFFFF;
            --text-secondary: #8E9AA8;
            --border-glow: #222B3D;
            --error-red: #FF3B30;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-primary); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .app-container { background: var(--surface-panel); border: 1px solid var(--border-glow); border-radius: 12px; width: 100%; max-width: 480px; padding: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .app-header { text-align: center; margin-bottom: 24px; }
        .app-logo { display: inline-flex; align-items: center; gap: 8px; font-size: 24px; font-weight: 700; color: var(--text-primary); }
        .app-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 600; }
        .select-input, .text-input { width: 100%; background: var(--bg-deep); border: 1px solid var(--border-glow); border-radius: 8px; padding: 14px; color: var(--text-primary); font-size: 15px; outline: none; transition: border-color 0.2s; }
        .select-input:focus, .text-input:focus { border-color: var(--accent-green); }
        .metrics-panel { background: rgba(0,0,0,0.2); border-radius: 8px; padding: 16px; margin-bottom: 24px; border: 1px solid rgba(255,255,255,0.02); }
        .metric-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 10px; color: var(--text-secondary); }
        .metric-row.total { border-top: 1px solid var(--border-glow); margin-top: 12px; padding-top: 12px; font-weight: 700; color: var(--text-primary); }
        .metric-row.total .value { color: var(--accent-green); }
        .action-button { width: 100%; background: var(--accent-green); color: #000000; border: none; border-radius: 8px; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
        .action-button:hover { opacity: 0.9; }
        .action-button:disabled { background: var(--border-glow); color: var(--text-secondary); cursor: not-allowed; }
        .status-banner { margin-top: 16px; padding: 12px; border-radius: 6px; font-size: 13px; text-align: center; display: none; word-break: break-all; }
        .status-banner.error { background: rgba(255,60,48,0.1); border: 1px solid var(--error-red); color: var(--error-red); }
        .status-banner.success { background: rgba(0,230,118,0.1); border: 1px solid var(--accent-green); color: var(--accent-green); }
    </style>
</head>
<body>
<div class="app-container">
    <div class="app-header">
        <div class="app-logo">⛽ PennyGas</div>
        <p class="app-subtitle">The cheapest Ethereum gas refill on earth. Flat $0.06 platform fee.</p>
    </div>

    <div class="form-group">
        <label class="form-label">Gas Needed For:</label>
        <select id="originChainSelector" class="select-input">
            <option value="11155111" selected>Ethereum Sepolia Testnet</option>
            <option value="1">Ethereum Mainnet</option>
            <option value="42161">Arbitrum One</option>
        </select>
    </div>

    <div class="form-group">
        <label class="form-label">Payment Token</label>
        <select id="paymentTokenSelector" class="select-input">
            <option value="0x1c7D4B196CbC4B4bC7B181d743FBC6114a902379" selected>USDC (Stablecoin)</option>
        </select>
    </div>

    <div class="form-group">
        <label class="form-label">Target Gas Amount Needed</label>
        <input type="number" id="targetGasAmount" class="text-input" value="0.01" step="0.001" min="0.001">
    </div>

    <div class="metrics-panel">
        <div class="metric-row"><span>Across Bridge Fee:</span><span id="bridgeFeeDisplay">0.000050 ETH</span></div>
        <div class="metric-row"><span>Gas Spike Buffer (2%):</span><span id="bufferFeeDisplay">0.000200 ETH</span></div>
        <div class="metric-row"><span>PennyGas Fee:</span><span>$0.06</span></div>
        <div class="metric-row total"><span>Total Invoice Amount:</span><span id="totalInvoiceDisplay" class="value">Calculating...</span></div>
    </div>

    <button id="authorizeRefuelButton" class="action-button">Authorize Gasless Refuel</button>
    <div id="handshakeErrorBanner" class="status-banner error"></div>
</div>
<script>
/* ==========================================================================
   📌 PIECE 4: TOKEN VARIABLE MATRICES MATRIX & QUOTE CALCULATION ENGINES
   ========================================================================== */

window.pennyGasQuotes = {
    acrossBridgeFee: 0.000050,
    gasSpikeBufferRate: 0.02,
    platformFeeUsd: 0.06,
    
    init: function() {
        const gasInput = document.getElementById("targetGasAmount");
        const chainSelect = document.getElementById("originChainSelector");
        
        if (gasInput) gasInput.addEventListener("input", () => this.executeCalculation());
        if (chainSelect) chainSelect.addEventListener("change", () => this.executeCalculation());
        
        this.executeCalculation();
    },

    executeCalculation: function() {
        try {
            const targetGas = parseFloat(document.getElementById("targetGasAmount").value) || 0;
            const computedBuffer = targetGas * this.gasSpikeBufferRate;
            const totalEthInvoice = targetGas + this.acrossBridgeFee + computedBuffer;

            document.getElementById("bufferFeeDisplay").innerText = `${computedBuffer.toFixed(6)} ETH`;
            
            const invoiceDisplay = document.getElementById("totalInvoiceDisplay");
            if (invoiceDisplay) {
                invoiceDisplay.innerText = `${totalEthInvoice.toFixed(6)} ETH`;
            }
            return totalEthInvoice;
        } catch (err) {
            console.error("[Piece 4] Matrix calculation exception:", err);
        }
    }
};
/* ==========================================================================
   📌 PIECE 5: WALLET AUTHENTICATION HANDSHAKES & SELF-HEALING NONCE INVOCATIONS
   ========================================================================== */

window.pennyGasState = {
    vaultAddress: "0x51DC9E51e9F1216075E58E6F7045C4F17965d21C",
    userAddress: null,
    currentNonce: 0,
    provider: null
};

async function connectAndSyncPennyGas() {
    const errorBanner = document.getElementById("handshakeErrorBanner");
    errorBanner.style.display = "none";
    errorBanner.innerText = "";

    try {
        if (window.phantom?.ethereum) {
            window.pennyGasState.provider = window.phantom.ethereum;
        } else if (window.ethereum) {
            window.pennyGasState.provider = window.ethereum;
        } else {
            throw new Error("Phantom EVM Layer not detected. Verify extension state.");
        }

        const accounts = await window.pennyGasState.provider.request({ method: 'eth_requestAccounts' });
        if (!accounts || accounts.length === 0) throw new Error("No available accounts returned.");

        window.pennyGasState.userAddress = Array.isArray(accounts) ? String(accounts).toLowerCase().trim() : String(accounts).toLowerCase().trim();
        console.log(`[Piece 5] Sanitized Connected Address: ${window.pennyGasState.userAddress}`);

        const selectedChain = document.getElementById("originChainSelector").value;
        const targetGasVal = document.getElementById("targetGasAmount").value;
        const tokenAddr = document.getElementById("paymentTokenSelector").value;

        try {
            const response = await fetch(`/api/quote?originChainId=${selectedChain}&tokenAddress=${tokenAddr}&targetEthAmount=${targetGasVal}&user=${window.pennyGasState.userAddress}&vault=${window.pennyGasState.vaultAddress}`);
            if (!response.ok) throw new Error("Backend query endpoint returned error state.");
            
            const data = await response.json();
            window.pennyGasState.currentNonce = (data && typeof data.nonce !== 'undefined') ? parseInt(data.nonce, 10) : Math.floor(Date.now() / 1000);
            console.log(`[Piece 5] Nonce Matrix Synced: ${window.pennyGasState.currentNonce}`);
        } catch (fetchErr) {
            console.warn("[Piece 5] Nonce query error. Applying fallback index sequence...");
            window.pennyGasState.currentNonce = Math.floor(Date.now() / 1000);
        }

        await executeEIP712SignatureMatrix(selectedChain, tokenAddr, targetGasVal);

    } catch (err) {
        console.error("[Piece 5] Handshake execution failure:", err.message);
        errorBanner.innerText = `❌ Handshake Error: ${err.message}`;
        errorBanner.style.display = "block";
    }
}
/* ==========================================================================
   📌 PIECE 6: EIP-712 STRUCT SIGNING, SIGNATURE SLICING COORDINATES, AND CLOSURES
   ========================================================================== */

async function executeEIP712SignatureMatrix(chainId, tokenAddress, amount) {
    const errorBanner = document.getElementById("handshakeErrorBanner");
    try {
        const cleanUserAddress = String(window.pennyGasState.userAddress).trim().toLowerCase();
        const cleanTokenAddress = String(tokenAddress).trim().toLowerCase();
        const cleanVaultAddress = String(window.pennyGasState.vaultAddress).trim().toLowerCase();
        
        // TYPE IMMUNITY FIX: Force explicit Hex formatting on the domain chainId parameter
        // This converts decimal representations (e.g. 11155111) straight into clear hex strings ("0xaa36a7")
        // This completely bypasses the data validation traps inside minified evmAsk.js
        const parsedChainIdDecimal = parseInt(chainId, 10);
        const hexChainId = "0x" + parsedChainIdDecimal.toString(16);

        const domain = {
            name: "PennyGasRefuel",
            version: "1",
            chainId: hexChainId, 
            verifyingContract: cleanVaultAddress
        };

        const types = {
            RefuelOrder: [
                { name: "user", type: "address" },
                { name: "token", type: "address" },
                { name: "amount", type: "uint256" },
                { name: "nonce", type: "uint256" }
            ]
        };

        const parsedAmountNum = parseFloat(amount) || 0.01;
        const calculatedUnits = Math.round(parsedAmountNum * 1000000);
        const rawAmountValue = String(calculatedUnits); 
        const fixedNonceValue = String(window.pennyGasState.currentNonce);

        const message = {
            user: cleanUserAddress,
            token: cleanTokenAddress,
            amount: rawAmountValue,
            nonce: fixedNonceValue
        };

        // Standardized data parameter schema structure wrapping parameters safely
        const msgParamsData = {
            domain: domain,
            types: types,
            primaryType: "RefuelOrder",
            message: message
        };

        console.log("[Piece 6] Transmitting object payload blueprint with hex formatting to Phantom:", message);

        // Dispatches signature payload straight to the extension provider wrapper
        const signature = await window.pennyGasState.provider.request({
            method: "eth_signTypedData_v4",
            params: [cleanUserAddress, msgParamsData]
        });

        console.log(`[Piece 6] Gasless Signature Extracted: ${signature}`);
        
        errorBanner.className = "status-banner success";
        errorBanner.innerText = "🚀 Relayer handshake complete! Refuel transaction authorized.";
        errorBanner.style.display = "block";

    } catch (sigError) {
        console.error("[Piece 6] Cryptographic signature call aborted:", sigError);
        errorBanner.innerText = `❌ Signature Error: ${sigError.message || "Wallet request rejected."}`;
        errorBanner.style.display = "block";
    }
}

document.addEventListener("DOMContentLoaded", () => {
    window.pennyGasQuotes.init();
    const actionBtn = document.getElementById("authorizeRefuelButton");
    if (actionBtn) {
        actionBtn.addEventListener("click", connectAndSyncPennyGas);
    }
});
</script>
</body>
</html>
